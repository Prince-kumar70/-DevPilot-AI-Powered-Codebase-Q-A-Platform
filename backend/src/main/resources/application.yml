server:
  port: 8080
  servlet:
    session:
      cookie:
        name: DEVPILOT_SESSION
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: devpilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/devpilot}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
            scope:
              - read:user
              - repo

  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY:your_gemini_api_key}
      chat:
        options:
          model: gemini-3.6-flash
      embedding:
        options:
          model: gemini-embedding-001
          dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true


app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD:devpilot_default_dev_password}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT:a1b2c3d4e5f67890}
  indexing:
    max-file-bytes: 102400
    chunk-size: 1600
  github:
    api-delay-ms: 50


  